<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
</head>
<body>
    <button id="btn">Click me</button>

    <script>
        let btn = document.getElementById("btn");

        btn.addEventListener("click", () => {
            alert("Button clicked");
        });
    </script>
</body>
</html>
