        angular.module('app1', []).controller('controller1', function ($scope, $http) {

    <input type="text" ng-model="searchString" />
    Sort by:
    <select ng-model="sortBy">
        <option value="CustomerID">Customer ID</option>
        <option value="ContactName">Contact name</option>
        <option value="City">City</option>
    </select>

    <table border="1">
        <thead>
            <tr>
                <td>ID</td>
                <td ng-click="sortBy='ContactName'">Contact name</td>
                <td>City</td>
            </tr>
        </thead>
        <tbody>
            <tr ng-repeat="cus in customers | limitTo:10 | orderBy:sortBy | filter:searchString">
                <td> {{cus.CustomerID}}</td>
                <td>{{cus.ContactName}}</td>
                <td>{{cus.City}}</td>
        </tbody>
    </table>
