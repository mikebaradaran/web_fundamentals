<!doctype html>
<html lang="en">
<head>
<title>Interactive Scene Demo</title>
<meta charset="utf-8">
<style>
body {
	font-family: Helvetica, Arial, sans-serif;
	background: -webkit-gradient(radial, center center, 0px, center center, 100%, color-stop(0%,#1e5799), color-stop(0%,#ffffff), color-stop(100%,#b6e3ef)); /* Chrome,Safari4+ */
	background: -webkit-radial-gradient(center, ellipse cover, #1e5799 0%,#ffffff 0%,#b6e3ef 100%); /* Chrome10+,Safari5.1+ */
	margin: 0px;
	overflow: hidden;
	line-height: 1.5em;
}
h1 {
	font-family: 'Merriweather', serif;
	color:#906;
	font-size: 4em;
	letter-spacing: -0.05em;
}
h2 {
	font-family: 'Merriweather', serif;
	font-size: 2em;
	letter-spacing: -0.05em;
}
#header {
	position: absolute;
	top: 5px;
	width: 66%;
	text-align: center;
	z-index: 100;
	display: block;
}
.info {
	position: absolute;
	color: #fff;
	top: 150px;
	right: 80px;
	width: 300px;
	height: 400px;
	padding: 20px;
	background-color: rgba(153, 0, 102, 0.8);
	z-index: 100;
	display: block;
	-webkit-border-radius: 15px;
	visibility: hidden;
}
a { color: skyblue }
</style>
</head>
<body>


</body>
</html>
