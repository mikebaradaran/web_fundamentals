            //-----------------------------------------------------

            var Person = function (data) {
                if (data) {
                    this.firstName = data.firstName;
                    this.lastName = data.lastName;
                }
            };

            Person.prototype.firstName = this.firstName;
            Person.prototype.lastName = this.lastName;

            Person.prototype.fullName = function () {

            };

            //
