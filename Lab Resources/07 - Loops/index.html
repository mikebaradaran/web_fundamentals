<!DOCTYPE html>
<html>
<head>
    <title></title>
    <meta charset="utf-8" />

    <style>
        table {
            width:50%
        }
    </style>
</head>
<body>
    <p>
        <script>
            var d = new Date();
            var w = d.getDay();

            var s;

            if (w == 0) s = "Sunday";
            if (w == 1) s = "Monday";
            if (w == 2) s = "Tuesday";
            if (w == 3) s = "Wednesday";
            if (w == 4) s = "Thursday";
            if (w == 5) s = "Friday";
            if (w == 6) s = "Saturday";

            document.write('Today is ' + s);
        </script>
    </p>
    <p>
        <script>
            var sum = 0;
            var i = 1;
            while (i <= 100) {
                sum += i;
                i++;
            }
            document.write("The total of the numbers between 1 and 100 is " + sum);
        </script>
    </p>
    <p>
        <script>
            var result = "";
            for (var i = 1; i <= 100; i++) {
                if (i % 2 == 1) {
                    //document.write(i + ", ");
                    result += i + ", ";
                }
            }
            document.write(result);
        </script>
    </p>
    <div id="timesTables">
        <script>
            var table = "<table>";
            for (var row = 0; row < 10; row++) {
                table += "<tr>";
                for (var column = 0; column < 10; column++) {
                    table += "<td>" + row * column + "</td>";
                }
                table += "</tr>";
            }
            table += "</table>"
            document.write(table);
        </script>
    </div>
</body>
</html>
