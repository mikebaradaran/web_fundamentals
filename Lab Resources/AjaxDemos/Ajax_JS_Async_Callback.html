<html lang="en">
<head>
    <title>QA</title>
</head>

<body>
    <div id='tbl'></div>
    <script>
        async function getCustomers(url, displayFunc) {
            const response = await fetch(url);
            let data = await response.json();
            displayFunc(data);
        }

        function display(data) {
            let count = 1;
            let tbl = '<table border=1>';
            data.forEach(x => {
                tbl += `<tr>
                            <td>${count++}</td>
                            <td>${x.CustomerID}</td>
                            <td>${x.ContactName}</td>
                            <td>${x.City}</td>
                        </tr>`;
            });
            tbl += '</table>';
            document.getElementById('tbl').innerHTML = tbl;
        }

        function log(data){
            console.log(data);
        }
        getCustomers('https://txMike2.glitch.me/customers', display);
        getCustomers('https://txMike2.glitch.me/customers', log);
    </script>
</body>

</html>
