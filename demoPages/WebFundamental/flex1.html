<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex1</title>
      <style>
        .flex-demo {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            background: blue;
            padding: 20px;
        }

        .flex-item {
            flex: 1 1 200px;
            /* grow, shrink, min width */
            background: lightgray;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h2>Flexbox Demo</h2>

      <div class="flex-demo">
        <div class="flex-item">A</div>
        <div class="flex-item">B</div>
        <div class="flex-item">C</div>
        <div class="flex-item">D</div>
        <div class="flex-item">D</div>
    </div>
</body>
