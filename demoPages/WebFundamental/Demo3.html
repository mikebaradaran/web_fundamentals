<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex2</title>

    <style>
        .container {
            display: flex;
            gap: 40px;
            background-color: red;
        }

        .box {
            flex: 1;
            background-color: green;
        }

        .title {
            font-weight: bold;
            margin-bottom: 10px;
        }

        .flex-small {
            display: flex;
            gap: 10px;
            background: blue;
            padding: 10px;
        }

        .grid-small {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            background: blue;
            padding: 10px;
        }

        .item {
            background: #ddd;
            padding: 10px;
            text-align: center;
            border-radius: 6px;
        }
    </style>
</head>

<body>
    <h2>Flex vs Grid Comparison</h2>
    <div class="container">
        <div class="box">
            <div class="title">Flexbox (1‑D)</div>
            <div class="flex-small">
                <div class="item">1</div>
                <div class="item">2</div>
                <div class="item">3</div>
            </div>
        </div>

        <div class="box">
            <div class="title">Grid (2‑D)</div>
            <div class="grid-small">
                <div class="item">1</div>
                <div class="item">2</div>
                <div class="item">3</div>
                <div class="item">4</div>
            </div>
        </div>
    </div>

</body>
