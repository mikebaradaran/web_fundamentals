<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <style>
    .container {
      display: flex;
      gap: 10px;
    }

    .item {
      flex: 1;
    
      background: black;
      color: white;
      padding: 20px;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="item">Item 1</div>
    <div class="item">Item 2</div>
    <div class="item">Item 3</div>
  </div>

  <h3>Explanation</h3>
  <pre>
<b>display: flex</b>  enables flex layout
<b>flex: 1</b>        all items grow equally to fill the container
<b>gap</b>            spacing between items
</pre>
</body>

</html>
